# Transcoding and passthrough rules for Plugins::MultichannelAudio
# 1. Server-Side LPCM Normalization -> uncompressed-level multichannel FLAC (client advertises 'flc' + 'mch=8')
mchflc flc * *
	# FT:{START=-ss %s}U:{END=-t %w}
	[ffmpeg] -v quiet $START$ $END$ -i $FILE$ -vn -c:a flac -compression_level 0 -f flac -

# 2. Bitstream Raw Elementary Passthrough (E-AC-3 Atmos -> 'E', TrueHD Atmos -> 'T', DTS-HD MA / Auro-3D -> 'H')
ec3 ec3 * *
	# FT:{START=-ss %s}U:{END=-t %w}
	[ffmpeg] -v quiet $START$ $END$ -i $FILE$ -vn -c:a copy -f eac3 -

thd thd * *
	# FT:{START=-ss %s}U:{END=-t %w}
	[ffmpeg] -v quiet $START$ $END$ -i $FILE$ -vn -c:a copy -f truehd -

dtshd dtshd * *
	# FT:{START=-ss %s}U:{END=-t %w}
	[ffmpeg] -v quiet $START$ $END$ -i $FILE$ -vn -c:a copy -f dts -

# 3. Universal Stereo Fallback & Stereo Matroska (.mka) Container Rule
mka flc * *
	# FT:{START=-ss %s}U:{END=-t %w}
	[ffmpeg] -v quiet $START$ $END$ -i $FILE$ -vn -c:a flac -compression_level 5 -f flac -

thd flc * *
	# FT:{START=-ss %s}U:{END=-t %w}
	[ffmpeg] -v quiet $START$ $END$ -i $FILE$ -vn -ac 2 -c:a flac -compression_level 5 -f flac -

ec3 flc * *
	# FT:{START=-ss %s}U:{END=-t %w}
	[ffmpeg] -v quiet $START$ $END$ -i $FILE$ -vn -ac 2 -c:a flac -compression_level 5 -f flac -

dtshd flc * *
	# FT:{START=-ss %s}U:{END=-t %w}
	[ffmpeg] -v quiet $START$ $END$ -i $FILE$ -vn -ac 2 -c:a flac -compression_level 5 -f flac -
