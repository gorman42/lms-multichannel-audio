# Transcoding and passthrough rules for Plugins::MultichannelAudio
# 1. Server-Side LPCM Normalization -> uncompressed-level multichannel FLAC (client advertises 'flc' + 'mch=8')
mchflc flc * *
	# ID:{RESAMPLE=-ar %d}
	[ffmpeg] -v quiet -f flac -i - -vn -c:a flac -compression_level 0 $RESAMPLE$ -f flac -

mchflc flc * *
	# FT:{START=-ss %s}U:{END=-t %w}D:{RESAMPLE=-ar %d}
	[ffmpeg] -v quiet $START$ $END$ -i $FILE$ -vn -c:a flac -compression_level 0 $RESAMPLE$ -f flac -

# 2. Bitstream Raw Elementary Passthrough (E-AC-3 Atmos -> 'E', TrueHD Atmos -> 'T', DTS-HD MA / Auro-3D -> 'H')
#    - '# I' rules stream unpacked elementary access units directly from ProtocolHandler_Matroska (zero ffmpeg)
#    - '# FT' rules handle standalone non-MKA files on disk
ec3 ec3 * *
	# I
	-

ec3 ec3 * *
	# FT:{START=-ss %s}U:{END=-t %w}
	[ffmpeg] -v quiet $START$ $END$ -i $FILE$ -vn -c:a copy -f eac3 -

thd thd * *
	# I
	-

thd thd * *
	# FT:{START=-ss %s}U:{END=-t %w}
	[ffmpeg] -v quiet $START$ $END$ -i $FILE$ -vn -c:a copy -f truehd -

dtshd dtshd * *
	# I
	-

dtshd dtshd * *
	# FT:{START=-ss %s}U:{END=-t %w}
	[ffmpeg] -v quiet $START$ $END$ -i $FILE$ -vn -c:a copy -f dts -

# 3. Universal Stereo Fallback & Stereo Matroska (.mka) Container Rule
mka flc * *
	# FT:{START=-ss %s}U:{END=-t %w}D:{RESAMPLE=-ar %d}
	[ffmpeg] -v quiet $START$ $END$ -i $FILE$ -vn -c:a flac -compression_level 5 $RESAMPLE$ -f flac -

thd flc * *
	# ID:{RESAMPLE=-ar %d}
	[ffmpeg] -v quiet -f truehd -i - -vn -ac 2 -c:a flac -compression_level 5 $RESAMPLE$ -f flac -

thd flc * *
	# FT:{START=-ss %s}U:{END=-t %w}D:{RESAMPLE=-ar %d}
	[ffmpeg] -v quiet $START$ $END$ -i $FILE$ -vn -ac 2 -c:a flac -compression_level 5 $RESAMPLE$ -f flac -

ec3 flc * *
	# ID:{RESAMPLE=-ar %d}
	[ffmpeg] -v quiet -f eac3 -i - -vn -ac 2 -c:a flac -compression_level 5 $RESAMPLE$ -f flac -

ec3 flc * *
	# FT:{START=-ss %s}U:{END=-t %w}D:{RESAMPLE=-ar %d}
	[ffmpeg] -v quiet $START$ $END$ -i $FILE$ -vn -ac 2 -c:a flac -compression_level 5 $RESAMPLE$ -f flac -

dtshd flc * *
	# ID:{RESAMPLE=-ar %d}
	[ffmpeg] -v quiet -f dts -i - -vn -ac 2 -c:a flac -compression_level 5 $RESAMPLE$ -f flac -

dtshd flc * *
	# FT:{START=-ss %s}U:{END=-t %w}D:{RESAMPLE=-ar %d}
	[ffmpeg] -v quiet $START$ $END$ -i $FILE$ -vn -ac 2 -c:a flac -compression_level 5 $RESAMPLE$ -f flac -
